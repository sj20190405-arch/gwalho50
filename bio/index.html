<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>바이오기초화학 2차 모의 문제풀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 바이오 랩 노트 디자인: 민트빛 실험대 바탕 · 흰 시료 카드 · 단원별 색(아미노산 호박색, 흡수 분광법 보라, 크로마토그래피 청록, 현미경 파랑) · 흡수 스펙트럼 띠 */
:root{
  --bg:#edf3ef; --paper:#ffffff; --ink:#10231e; --muted:#5b6f69; --line:#d4e0da; --soft:#f4f8f6;
  --accent:#0d7a62; --accent-ink:#ffffff; --accent-soft:#dcf1e8;
  --ok:#157a3e; --ok-soft:#e3f5ea; --bad:#c0262d; --bad-soft:#fdecec; --warn:#8a5a00; --warn-soft:#fdf2d8;
  --u0:#b26a00; --u0s:#fbefdc; --u1:#6d44d8; --u1s:#eee8fc; --u2:#0d7a62; --u2s:#dcf1e8; --u3:#2459d6; --u3s:#e3ebfc;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(16,35,30,.05),0 6px 20px rgba(16,35,30,.06);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0c1513; --paper:#14201d; --ink:#e3eeea; --muted:#94aaa3; --line:#263833; --soft:#1a2925;
  --accent:#4fd1ab; --accent-ink:#06261d; --accent-soft:#163a30;
  --ok:#5fd394; --ok-soft:#14301f; --bad:#f2857f; --bad-soft:#3a1c1c; --warn:#f0c26a; --warn-soft:#3a2f18;
  --u0:#f2b04f; --u0s:#3a2a12; --u1:#a98cf5; --u1s:#2a2144; --u2:#4fd1ab; --u2s:#163a30; --u3:#7fa6ff; --u3s:#1b2a4d;
  --shadow:none; color-scheme:dark}}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 90px}
.wrap.wide{max-width:1120px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* header */
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:6px}
.kicker{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;color:var(--accent);font-weight:600;margin:0 0 4px}
h1{font-size:1.55rem;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.spectrum{height:5px;border-radius:99px;margin:12px 0 18px;background:linear-gradient(90deg,#6d28d9,#2563eb 22%,#0ea5e9 36%,#10b981 52%,#eab308 68%,#f97316 82%,#dc2626)}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:9px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
/* controls */
button,.btn{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.primary:hover{filter:brightness(1.06)}
button.danger{border-color:var(--bad);color:var(--bad)}
button.danger.solid{background:var(--bad);color:#fff}
button[disabled]{opacity:.45;cursor:not-allowed}
label{font-size:.84rem;color:var(--muted);display:block;margin-bottom:4px}
input[type=text],input[type=number],input[type=password],select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.notice{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:.93rem}
.notice.info{background:var(--accent-soft)} .notice.bad{background:var(--bad-soft);color:var(--bad)} .notice.warn{background:var(--warn-soft);color:var(--warn)}
.muted{color:var(--muted)} .err{color:var(--bad);font-size:.86rem;min-height:1.3em;margin-top:6px}
h2{font-size:1.1rem;margin:0 0 6px} h3{font-size:1rem;margin:0 0 10px}
/* unit colors */
.u0{--u:var(--u0);--us:var(--u0s)} .u1{--u:var(--u1);--us:var(--u1s)} .u2{--u:var(--u2);--us:var(--u2s)} .u3{--u:var(--u3);--us:var(--u3s)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--u);background:var(--us);border-radius:99px;padding:2px 10px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--u)}
.tbadge{font-size:.76rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
/* start screen */
.units{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
@media (max-width:640px){.units{grid-template-columns:repeat(2,1fr)}}
.unit{border:1px solid var(--line);border-top:4px solid var(--u);border-radius:12px;padding:10px 12px;background:var(--soft)}
.unit small{display:block;font-family:var(--f-mono);font-size:.72rem;color:var(--u);font-weight:600}
.unit b{display:block;font-size:.98rem}
.unit span{font-size:.8rem;color:var(--muted)}
.unit em{font-style:normal;font-family:var(--f-mono);font-size:1.5rem;font-weight:600;color:var(--u);display:block;line-height:1.2;margin-top:4px}
.types{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px;font-size:.85rem;color:var(--muted)}
.idgrid{display:grid;grid-template-columns:1fr 1fr 2fr;gap:12px;margin:16px 0 6px}
@media (max-width:480px){.idgrid{grid-template-columns:1fr 1fr}.idgrid>div:last-child{grid-column:1/-1}}
.startrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.startrow .primary{padding:13px 22px;font-size:1.05rem}
.mine{font-size:.86rem;background:var(--accent-soft);border-radius:10px;padding:8px 12px}
/* quiz top bar */
.qbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:10px 0 12px;margin-bottom:6px}
.qbar .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.86rem}
.qbar .who{font-weight:600}
.qbar .cnt{font-family:var(--f-mono);color:var(--muted)} .qbar .cnt b{color:var(--accent)}
.strip{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;margin-top:8px}
.cell{height:12px;border-radius:3px;background:var(--us);border:0;padding:0;cursor:pointer;position:relative}
.cell.done{background:var(--u)}
.cell.now{outline:2px solid var(--ink);outline-offset:1px}
.cell.gap{margin-left:5px}
/* question card */
.qcard{border-left:5px solid var(--u);padding:22px 20px}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.qno{margin-left:auto;font-family:var(--f-mono);font-weight:600;font-size:1.05rem;color:var(--muted)} .qno b{color:var(--ink);font-size:1.4rem}
.stem{font-size:1.17rem;line-height:1.85;margin:0 0 16px;word-break:keep-all}
.stem input.inl{display:inline-block;width:8.5em;max-width:100%;font-size:1.05rem;padding:2px 8px;margin:0 4px;border:0;border-bottom:2.5px solid var(--u);border-radius:6px 6px 0 0;background:var(--us);color:var(--ink);text-align:center}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--u);background:var(--us);border-radius:5px 5px 0 0;margin:0 4px;padding:0 8px;text-align:center}
.opts{display:grid;gap:9px}
.opt{justify-content:flex-start;text-align:left;gap:12px;padding:13px 14px;font-size:1.04rem;border-radius:12px;width:100%;line-height:1.45}
.opt .k{flex:none;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);font-family:var(--f-mono);font-weight:600;font-size:.88rem;color:var(--muted)}
.opt[aria-pressed="true"]{border:1.5px solid var(--u);background:var(--us);font-weight:600}
.opt[aria-pressed="true"] .k{background:var(--u);border-color:var(--u);color:#fff}
.short{display:flex;align-items:center;gap:8px}
.short input{font-size:1.12rem;padding:12px 14px;max-width:340px}
.short .unitlbl{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.fnote{font-size:.84rem;color:var(--muted);margin:8px 0 0}
.hintbtn{margin-top:16px;padding:6px 12px;font-size:.88rem;color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line));background:var(--paper)}
.hintbtn svg{width:16px;height:16px}
.hintbox{margin-top:10px;border:1.5px dashed color-mix(in srgb,var(--warn) 55%,transparent);background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:.95rem}
.hintbox b{color:var(--warn);margin-right:6px}
.nav{display:flex;gap:10px;margin-top:18px}
.nav button{padding:13px 16px;font-weight:600}
.nav #prev{flex:0 0 30%} .nav .primary{flex:1}
.subrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:14px}
.confirm{margin-top:14px;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.confirm .acts{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
/* result */
.score{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.big{font-family:var(--f-mono);font-size:3.2rem;font-weight:600;line-height:1;letter-spacing:-.03em}
.big small{font-size:1.2rem;color:var(--muted);font-weight:500}
.pct{font-family:var(--f-mono);font-size:.9rem;color:var(--accent);font-weight:600}
.bars{display:grid;gap:8px;margin:18px 0 4px}
.barrow{display:grid;grid-template-columns:7.5em 1fr 3.5em;gap:10px;align-items:center;font-size:.88rem}
.track{height:9px;background:var(--us);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--u);border-radius:99px}
.barrow .v{font-family:var(--f-mono);text-align:right;color:var(--muted)}
.filter{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;width:max-content;margin:18px 0 12px}
.filter button{border:0;padding:6px 12px;font-size:.88rem}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.rv{border-left:5px solid var(--u);margin-bottom:12px;padding:16px 18px}
.rv .stem{font-size:1.02rem;margin-bottom:10px}
.mark{font-family:var(--f-mono);font-weight:700;font-size:.82rem;border-radius:6px;padding:1px 8px;margin-left:auto}
.mark.ok{background:var(--ok-soft);color:var(--ok)} .mark.bad{background:var(--bad-soft);color:var(--bad)}
.ropts{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px;font-size:.93rem}
.ropts li{padding:5px 10px;border-radius:8px;border:1px solid transparent}
.ropts li.correct{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.ropts li.picked:not(.correct){background:var(--bad-soft)}
.ropts .tag{font-size:.74rem;font-weight:700;margin-left:6px}
.ans{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.93rem;margin-bottom:10px}
.ans dt{color:var(--muted)} .ans dd{margin:0;font-weight:600}
.ans dd.me.bad{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px} .ans dd.me.ok{color:var(--ok)} .ans dd.right{color:var(--ok)}
.expl{background:var(--soft);border-radius:10px;padding:10px 13px;font-size:.93rem;line-height:1.65}
.expl b{color:var(--accent);margin-right:6px}
/* teacher */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar select{width:auto}
.toolbar label{margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-family:var(--f-mono);font-size:1.5rem;font-weight:600}
.tile span{color:var(--muted);font-size:.82rem}
.tile.uc{border-top:4px solid var(--u)} .tile.uc b{color:var(--u)}
.tblwrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--soft);font-weight:600;font-size:.82rem;color:var(--muted)}
td.num{text-align:right}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.82rem;font-family:var(--f-mono);font-weight:600}
.pill.hi{background:var(--ok-soft);color:var(--ok)} .pill.mid{background:var(--warn-soft);color:var(--warn)} .pill.lo{background:var(--bad-soft);color:var(--bad)}
.minis{display:flex;gap:4px} .minis span{font-family:var(--f-mono);font-size:.76rem;color:var(--u);background:var(--us);border-radius:5px;padding:0 5px}
.sm{padding:3px 10px;font-size:.8rem}
.detail td{white-space:normal;background:var(--soft)}
.wrong{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:6px;margin-top:8px}
.wrong div{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--u);border-radius:8px;padding:6px 8px;font-size:.84rem;display:flex;gap:8px;align-items:center;justify-content:space-between}
.wrong button{flex:none;white-space:nowrap}
.wrong .q{display:block;color:var(--muted);font-size:.78rem;max-width:30ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin-top:14px}
.qstat{display:grid;grid-template-columns:3em minmax(0,1fr) 3.4em;gap:8px;align-items:center;font-size:.86rem;padding:5px 0;border-bottom:1px dashed var(--line)}
.qstat .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qstat .n{font-family:var(--f-mono);color:var(--u);font-weight:600}
.qstat .qb{grid-column:2/4;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.qstat .qb i{display:block;height:100%;background:var(--bad)}
.switch{display:flex;gap:8px;align-items:center;font-size:.92rem;color:var(--ink);margin:8px 0}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.track i,.cell{transition:all .25s}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div>
      <p class="kicker">BIO-CHEM · 2026-2 · 2차 정기시험 대비</p>
      <h1>바이오기초화학 모의 문제풀이</h1>
    </div>
    <div class="tabs">
      <button id="tabStudent" aria-pressed="true">문제 풀기</button>
      <button id="tabTeacher" aria-pressed="false">교사</button>
    </div>
  </header>
  <div class="spectrum" aria-hidden="true"></div>
  <div id="notice"></div>
  <main id="studentView"><div class="card">불러오는 중입니다…</div></main>
  <main id="teacherView" hidden></main>
</div>
<script>
"use strict";
// ======================================================================
//  ★ 설정: Apps Script 웹 앱 주소  ★
// ======================================================================
const API_URL = "https://script.google.com/macros/s/AKfycbztxlUuSxMyJuWzt2310LMhAIhNj5uFmHsptwT4zPWHQ5617NntSGTAfEet4tm-yqHn/exec";
const NUMS = ["①","②","③","④"], TL = {b:"괄호넣기", m:"4지선다", s:"단답형"};
const SEC_FALLBACK = [{t:"Ⅳ-01 아미노산",short:"아미노산",n:20},{t:"Ⅶ-01 흡수 분광법",short:"흡수 분광법",n:40},{t:"Ⅶ-02 크로마토그래피",short:"크로마토그래피",n:40},{t:"Ⅶ-03 현미경",short:"현미경",n:20}];
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const HINT_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>`;
function notice(html, kind="warn"){ $("#notice").innerHTML = html ? `<div class="notice ${kind}">${html}</div>` : ""; }
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||"null"); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }
function fmtDate(d){ if(!d) return ""; const [y,m,dd]=String(d).split("-"); return `${+m}월 ${+dd}일`; }
async function api(action, payload={}){
  if(!/^https:\/\//.test(API_URL)) throw new Error("아직 서버 주소(API_URL)가 설정되지 않았습니다. 선생님께 문의하세요.");
  let r;
  try{ r = await fetch(API_URL, {method:"POST", body: JSON.stringify({action, ...payload})}); }
  catch(e){ throw new Error("서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요."); }
  const j = await r.json().catch(()=>({ok:false,error:"서버 응답을 읽지 못했습니다."}));
  if(!j.ok) throw new Error(j.error||"요청을 처리하지 못했습니다.");
  return j.data;
}
const secs = () => (CFG && CFG.sections) || SEC_FALLBACK;
// 빈칸 {} 를 보여 줄 때
function stemHtml(s, fill){ const [b,c]=String(s).split("{}"); return c===undefined ? esc(s) : `${esc(b)}${fill}${esc(c)}`; }

// ---------------- student ----------------
let CFG=null, ident=store("bio2-ident")||{cls:"",num:"",name:""};
let stage="loading", quiz=null, draft=[], hints={}, cur=0, result=null, confirming=false, busy=false, rvFilter="wrong";
const saveKey="bio2-quiz";
function persist(){ if(quiz) store(saveKey,{quiz,draft,hints,cur,ident}); }

function renderStudent(){
  const el=$("#studentView");
  if(stage==="loading"){ el.innerHTML=`<div class="card">불러오는 중입니다…</div>`; return; }
  if(stage==="result") return renderResult(el);
  if(stage==="quiz") return renderQuiz(el);
  const S=secs(), plan=(CFG&&CFG.plan)||[5,10,10,5], saved=store(saveKey);
  const canResume = saved && CFG && saved.quiz && saved.quiz.date===CFG.today;
  el.innerHTML=`<div class="card">
    <h2>${CFG?fmtDate(CFG.today)+" · ":""}2차 정기시험 대비 모의 문제풀이</h2>
    <p class="muted" style="margin:0">문제은행 ${(CFG&&CFG.total)||120}문항 중 <b>${plan.reduce((a,b)=>a+b,0)}문항</b>이 단원별 비율대로 출제됩니다. 다시 풀 때마다 새 문제가 나오고, 지난번에 틀린 문제 일부가 다시 나옵니다.</p>
    <div class="units">${S.map((s,i)=>`<div class="unit u${i}"><small>${esc(s.t.split(" ")[0])}</small><b>${esc(s.short)}</b><em>${plan[i]}<span> 문항</span></em><span>문제은행 ${s.n}문항</span></div>`).join("")}</div>

async function begin(){

const filled=()=>draft.filter(x=>String(x??"").trim()!=="").length;
function renderQuiz(el){

  if(q.t==="b") body+=`<p class="fnote">빈칸에 알맞은 말을 쓰세요. 띄어쓰기·사소한 오탈자는 정답으로 인정됩니다.</p>`;

      <div class="strip" role="group" aria-label="문항 이동">${qs.map((x,p)=>`<button class="cell u${x.si} ${String(draft[p]??"").trim()!==""?"done":""} ${p===cur?"now":""} ${p>0&&qs[p-1].si!==x.si?"gap":""}" data-go="${p}" aria-label="${p+1}번 ${esc(S[x.si].short)}" title="${p+1}번"></button>`).join("")}</div></div>
    <div class="card qcard u${q.si}">
      <div class="qmeta"><span class="chip">${esc(S[q.si].t)}</span><span class="tbadge">${TL[q.t]}</span><span class="qno"><b>${String(cur+1).padStart(2,"0")}</b> / ${n}</span></div>
      ${body}
      <button class="hintbtn" id="hintBtn" aria-expanded="${!!hints[cur]}">${HINT_SVG}${hints[cur]?"힌트 숨기기":"힌트 보기"}</button>
      ${hints[cur]?`<div class="hintbox" role="note"><b>힌트</b>${esc(q.h)}</div>`:""}
      <div class="nav"><button id="prev" ${cur===0?"disabled":""}>← 이전</button>${last?`<button class="primary" id="goSubmit">제출하기</button>`:`<button class="primary" id="next">다음 →</button>`}</div>
    </div>

  let t=null;
  if(inp){ inp.addEventListener("input",()=>{ draft[cur]=inp.value; sync(); clearTimeout(t); t=setTimeout(persist,300); });
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); if(last) openConfirm(); else go(cur+1); } }); }
  el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{ draft[cur]=b.dataset.o; persist(); el.querySelectorAll("[data-o]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); sync(); });

  renderSubmitArea(); if(!confirming && inp) inp.focus({preventScroll:true});

function rvCard(x,S){

  else { mid=`<p class="stem">${x.t==="b"?stemHtml(x.s,`<span class="blank">${x.ok?esc(x.ans):"?"}</span>`):esc(x.s)}</p>

  return `<div class="card rv u${x.si}">${head}${mid}<div class="expl"><b>해설</b>${esc(x.e)}</div></div>`;
}

    </table></div>
    <div class="grid2">
      <div class="card"><h3>많이 틀린 문항 <span class="muted" style="font-weight:400;font-size:.85rem">(출제된 학생 중 정답률)</span></h3>${n?worst.map(w=>{ const q=Qd[w.i]; return `<div class="qstat u${q.si}"><span class="n">#${w.i+1}</span><span class="t" title="${esc(q.s.replace("{}","(  )")+" → "+q.a)}">${esc(q.a)} · ${esc(q.s.replace("{}","(  )").slice(0,30))}…</span><span class="mono" title="${w.k}명 출제" style="text-align:right">${Math.round(w.a*100)}%</span><span class="qb"><i style="width:${Math.round((1-w.a)*100)}%"></i></span></div>`; }).join(""):`<p class="muted">제출이 들어오면 문항별 정답률이 계산됩니다.</p>`}</div>
      <div class="card"><h3>시험 설정</h3>
        <label class="switch"><input type="checkbox" id="sOpen" ${T.settings.open?"checked":""}> 학생 응시 열기</label>
        <label class="switch"><input type="checkbox" id="sShow" ${T.settings.showAnswers?"checked":""}> 제출 후 정답·해설 공개</label>
        <p class="muted" style="font-size:.85rem;margin:6px 0 0">한 번 응시하면 30문항(아미노산 5 · 흡수 분광법 10 · 크로마토그래피 10 · 현미경 5)이 나옵니다. 다시 풀 때마다 새 문제가 나오고, 그 학생이 지난번에 틀린 문제가 일부 다시 나옵니다. 회차마다 결과가 따로 기록됩니다.</p>
        <p class="muted" style="font-size:.85rem">띄어쓰기·사소한 오탈자는 자동으로 정답 처리되고, 숫자 답은 단위를 붙여도 정답입니다. 오답 보기에서 <b>인정</b>을 누르면 그 문항을 직접 정답 처리할 수 있습니다.</p></div>
    </div>`;
  $("#fDate").onchange=e=>{fDate=e.target.value;openRow=null;tcall("tData");};
  $("#fCls").onchange=e=>{fCls=e.target.value;renderTeacher();};
  $("#fLast").onchange=e=>{fLast=e.target.value==="last";renderTeacher();};
  $("#refresh").onclick=()=>tcall("tData");
  $("#lockBtn").onclick=()=>{ pw=null; T=null; openRow=null; stopPoll(); try{sessionStorage.removeItem("bio2-pw");}catch(e){} show("student"); };
  el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{openRow=openRow===b.dataset.open?null:b.dataset.open;renderTeacher();});
  el.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>arm("row",b.dataset.reset,()=>{ openRow=null; tcall("tResetOne",{key:b.dataset.reset}); }));
  el.querySelectorAll("[data-stu]").forEach(b=>b.onclick=()=>arm("stu",b.dataset.stu,()=>{ openRow=null; const [who,name]=b.dataset.stu.split("|"); tcall("tResetStudent",{who,name}); }));
  el.querySelectorAll("[data-ov]").forEach(b=>b.onclick=()=>tcall("tOverride",{key:b.dataset.key, qi:+b.dataset.ov, on:b.dataset.on==="1"}));
  $("#rstDay").onclick=()=>{resetStage="day";renderReset();};
  $("#rstAll").onclick=()=>{resetStage="all";renderReset();};
  $("#sOpen").onchange=e=>tcall("tSettings",{settings:{open:e.target.checked}});
  $("#sShow").onchange=e=>tcall("tSettings",{settings:{showAnswers:e.target.checked}});
  renderReset();
}
function arm(kind,k,fn){ const cur=kind==="row"?rowArm:stuArm;
  if(cur===k){ rowArm=stuArm=null; fn(); return; }
  if(kind==="row") rowArm=k; else stuArm=k; renderTeacher();
  setTimeout(()=>{ if((kind==="row"?rowArm:stuArm)===k){ rowArm=stuArm=null; renderTeacher(); } },5000); }
function detailRow(s,Qd,SN){
  const rows=s.items.filter(x=>!x.ok||x.ov), sk=s.cls+"-"+s.num+"|"+s.name;
  return `<tr class="detail"><td colspan="9"><div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><b>${esc(s.name)}</b> 오답 ${rows.filter(x=>!x.ok).length}개 <span class="muted">(시험지 번호 · #문제은행 번호)</span>
    <span style="flex:1"></span><button class="sm danger ${stuArm===sk?"solid":""}" data-stu="${esc(sk)}">${stuArm===sk?"한 번 더 누르면 이 학생 기록 모두 삭제":"이 학생 기록 모두 삭제"}</button></div>
    <div class="wrong">${rows.map(x=>{ const q=Qd[x.qi]; return `<div class="u${q.si}"><span><b>${x.p+1}</b><span class="muted"> · #${x.qi+1}</span> ${esc(x.ans||"(빈칸)")} → <span style="color:var(--ok)">${esc(q.a)}</span><span class="q" title="${esc(q.s.replace("{}","(  )"))}">${esc(SN[q.si])} · ${esc(q.s.replace("{}","(  )"))}</span></span>
      <button class="sm" data-key="${esc(s.key)}" data-ov="${x.qi}" data-on="${x.ov?0:1}">${x.ov?"인정 취소":"인정"}</button></div>`; }).join("")||"<span class='muted'>틀린 문항이 없습니다.</span>"}</div></td></tr>`;
}
function renderReset(){
  const a=$("#rstArea"); if(!a) return;
  if(!resetStage){ a.innerHTML=""; return; }
  const what=resetStage==="all"?"모든 날짜의 모든 응시 기록":`${fmtDate(fDate)} 응시 기록 전체`;
  a.innerHTML=`<div class="confirm" style="margin:0 0 12px"><span><b>${what}</b>을 지웁니다. 되돌릴 수 없습니다. 확인하려면 <b>초기화</b>를 입력하세요.</span>
    <input id="rstTxt" type="text" style="width:8em" aria-label="확인 문구"><span class="acts"><button id="rNo">취소</button><button class="danger solid" id="rYes" disabled>지우기</button></span></div>`;
  $("#rstTxt").oninput=e=>{$("#rYes").disabled=e.target.value.trim()!=="초기화";};
  $("#rNo").onclick=()=>{resetStage=0;renderReset();};
  $("#rYes").onclick=async()=>{ const m=resetStage, d=fDate; resetStage=0; await tcall(m==="all"?"tResetAll":"tResetDay",{day:d}); notice(m==="all"?"모든 기록을 지웠습니다.":`${fmtDate(d)} 기록을 지웠습니다.`,"info"); };
}
function startPoll(){ stopPoll(); poll=setInterval(()=>{ if(pw && !$("#teacherView").hidden && !resetStage && !rowArm && !stuArm) tcall("tData"); },20000); }
function stopPoll(){ if(poll) clearInterval(poll); poll=null; }

// ---------------- tabs & boot ----------------
function show(tab){
  const t=tab==="teacher";
  $("#studentView").hidden=t; $("#teacherView").hidden=!t;
  $("#tabStudent").setAttribute("aria-pressed",String(!t)); $("#tabTeacher").setAttribute("aria-pressed",String(t));
  $("#app").classList.toggle("wide",t); notice("");
  if(t){ renderTeacher(); if(pw){ startPoll(); if(T) tcall("tData"); } } else { stopPoll(); renderStudent(); }
}
$("#tabStudent").onclick=()=>show("student");
$("#tabTeacher").onclick=()=>show("teacher");
if(location.hash==="#teacher") show("teacher");
stage="loading"; renderStudent(); refreshCfg();
</script>
</body>
</html>
